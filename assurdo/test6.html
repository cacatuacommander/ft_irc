        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
        const d = 6;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.GridHelper(20, 20, 0x00fff2, 0x111122));
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        const loader = new THREE.TextureLoader();

        class Fighter {
            constructor(base64Data, startX) {
                this.hp = 100;
                this.maxHp = 100;

                // Sprite Personaggio
                const tex = loader.load(base64Data);
                const mat = new THREE.SpriteMaterial({ map: tex, color: 0xffffff });
                this.sprite = new THREE.Sprite(mat);
                this.sprite.scale.set(2, 2, 1);
                this.sprite.position.set(startX, 1, 0);
                scene.add(this.sprite);

                // Barra della Salute (Contenitore grigio)
                const healthBgGeo = new THREE.PlaneGeometry(1.5, 0.2);
                const healthBgMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
                this.healthBg = new THREE.Mesh(healthBgGeo, healthBgMat);
                this.healthBg.position.y = 1.5; // Sopra la testa
                this.sprite.add(this.healthBg);

                // Barra della Salute (Parte verde)
                const healthBarGeo = new THREE.PlaneGeometry(1.5, 0.2);
                const healthBarMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                this.healthBar = new THREE.Mesh(healthBarGeo, healthBarMat);
                this.healthBar.position.z = 0.01; // Leggermente davanti al grigio
                this.healthBg.add(this.healthBar);

                // Hitbox visiva (Cerchio attacco)
                const hitGeo = new THREE.TorusGeometry(0.6, 0.05, 16, 32);
                const hitMat = new THREE.MeshBasicMaterial({ color: 0x00fff2, transparent: true, opacity: 0 });
                this.hitRing = new THREE.Mesh(hitGeo, hitMat);
                this.hitRing.rotation.x = Math.PI / 2;
                scene.add(this.hitRing);

                this.isAttacking = false;
                this.canDealDamage = false; // Per evitare che un attacco tolga vita ogni frame
                this.facing = new THREE.Vector3(startX > 0 ? -1 : 1, 0, 0);
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp < 0) this.hp = 0;
                
                // Aggiorna scala barra verde
                const scale = this.hp / this.maxHp;
                this.healthBar.scale.x = scale;
                // Sposta la barra per farla accorciare da un lato
                this.healthBar.position.x = (1 - scale) * -0.75;

                // Flash Rosso
                this.sprite.material.color.set(0xff0000);
                setTimeout(() => {
                    this.sprite.material.color.set(0xffffff);
                }, 150);
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                this.canDealDamage = true;
                this.hitRing.material.opacity = 1;
                this.sprite.position.add(this.facing.clone().multiplyScalar(0.4));

                setTimeout(() => {
                    this.isAttacking = false;
                    this.canDealDamage = false;
                    this.hitRing.material.opacity = 0;
                    this.sprite.position.sub(this.facing.clone().multiplyScalar(0.4));
                }, 200);
            }

            update(keys, up, down, left, right, atkKey) {
                const move = new THREE.Vector3(0, 0, 0);
                if (keys[up]) move.z -= 1;
                if (keys[down]) move.z += 1;
                if (keys[left]) move.x -= 1;
                if (keys[right]) move.x += 1;

                if (move.length() > 0) {
                    move.normalize().multiplyScalar(0.1);
                    this.sprite.position.add(move);
                    this.facing.copy(move).normalize();
                    this.sprite.position.y = 1 + Math.abs(Math.sin(Date.now() * 0.01)) * 0.2;
                }

                if (keys[atkKey]) this.attack();

                this.hitRing.position.copy(this.sprite.position);
                this.hitRing.position.y = 0.1;
                this.hitRing.position.add(this.facing.clone().multiplyScalar(1));
            }
        }

        const p1 = new Fighter(imgDataP1, -3);
        const p2 = new Fighter(imgDataP2, 3);

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            p1.update(keys, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Digit1');
            p2.update(keys, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Digit0');

            // Collisione P1 verso P2
            if (p1.isAttacking && p1.canDealDamage) {
                if (p1.hitRing.position.distanceTo(p2.sprite.position) < 1.2) {
                    p2.takeDamage(10);
                    p1.canDealDamage = false; // Colpisce una volta sola per attacco
                }
            }

            // Collisione P2 verso P1
            if (p2.isAttacking && p2.canDealDamage) {
                if (p2.hitRing.position.distanceTo(p1.sprite.position) < 1.2) {
                    p1.takeDamage(10);
                    p2.canDealDamage = false;
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
