<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Cube Fighter - 42 Transcendence Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a12; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00fff2; pointer-events: none; text-shadow: 0 0 8px #00fff2; }
        .stats { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">CUBE BATTLE 42</div>
        <div style="color: white; font-size: 0.8em; margin-top: 5px;">P1: WASD + [1] | P2: FRECCE + [0]</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- GENERATORE DI IMMAGINI (Incoroporate nel codice) ---
        function getPlayerDataURL(color, isP2) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Ombra
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(15, 20, 100, 100);

            // Corpo Cubico con gradiente
            const grd = ctx.createLinearGradient(0, 0, 0, 128);
            grd.addColorStop(0, color);
            grd.addColorStop(1, "#111");
            ctx.fillStyle = grd;
            ctx.fillRect(10, 10, 108, 108);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, 108, 108);

            // Occhi (orientati)
            ctx.fillStyle = "white";
            const eyeX = isP2 ? 20 : 70;
            ctx.fillRect(eyeX, 40, 20, 25);
            ctx.fillRect(eyeX + 30, 40, 20, 25);
            
            // Pupille luminose
            ctx.fillStyle = "#00fff2";
            ctx.fillRect(isP2 ? eyeX + 2 : eyeX + 8, 45, 10, 15);
            ctx.fillRect(isP2 ? eyeX + 32 : eyeX + 38, 45, 10, 15);

            return canvas.toDataURL();
        }

        // --- SETUP SCENA ---
        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
        const d = 6;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Pavimento Neon
        const grid = new THREE.GridHelper(20, 20, 0x00fff2, 0x222244);
        scene.add(grid);

        const loader = new THREE.TextureLoader();

        // --- CLASSE LOTTATORE ---
        class Fighter {
            constructor(color, startX, isP2) {
                const tex = loader.load(getPlayerDataURL(color, isP2));
                const mat = new THREE.SpriteMaterial({ map: tex });
                this.sprite = new THREE.Sprite(mat);
                this.sprite.scale.set(1.8, 1.8, 1);
                this.sprite.position.set(startX, 0.9, 0);
                scene.add(this.sprite);

                // Hitbox d'attacco (Cerchio neon)
                const hitGeo = new THREE.TorusGeometry(0.7, 0.04, 16, 100);
                const hitMat = new THREE.MeshBasicMaterial({ color: 0x00fff2, transparent: true, opacity: 0 });
                this.hitRing = new THREE.Mesh(hitGeo, hitMat);
                this.hitRing.rotation.x = Math.PI / 2;
                scene.add(this.hitRing);

                this.isAttacking = false;
                this.facing = new THREE.Vector3(isP2 ? -1 : 1, 0, 0);
                this.originalColor = new THREE.Color(0xffffff);
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                
                // Animazione: scatto e accensione ring
                this.hitRing.material.opacity = 1;
                this.sprite.scale.set(2.2, 2.2, 1);
                
                setTimeout(() => {
                    this.isAttacking = false;
                    this.hitRing.material.opacity = 0;
                    this.sprite.scale.set(1.8, 1.8, 1);
                }, 150);
            }

            update(keys, up, down, left, right, atkKey) {
                const move = new THREE.Vector3(0, 0, 0);
                if (keys[up]) move.z -= 1;
                if (keys[down]) move.z += 1;
                if (keys[left]) move.x -= 1;
                if (keys[right]) move.x += 1;

                if (move.length() > 0) {
                    move.normalize().multiplyScalar(0.12);
                    this.sprite.position.add(move);
                    this.facing.copy(move).normalize();
                    // Saltello camminata
                    this.sprite.position.y = 0.9 + Math.abs(Math.sin(Date.now() * 0.012)) * 0.3;
                } else {
                    this.sprite.position.y = 0.9;
                }

                if (keys[atkKey]) this.attack();

                // Ring segue l'attacco
                this.hitRing.position.copy(this.sprite.position);
                this.hitRing.position.y = 0.05;
                this.hitRing.position.add(this.facing.clone().multiplyScalar(1.2));
            }
        }

        const p1 = new Fighter('#ff3e3e', -3, false);
        const p2 = new Fighter('#3e8eff', 3, true);

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function checkCollision(atk, vic) {
            if (atk.isAttacking) {
                const dist = atk.hitRing.position.distanceTo(vic.sprite.position);
                if (dist < 1.3) {
                    vic.sprite.material.color.set(0xffffff); // Effetto flash bianco
                    setTimeout(() => vic.sprite.material.color.set(0xffffff), 50);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            p1.update(keys, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Digit1');
            p2.update(keys, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Digit0');

            checkCollision(p1, p2);
            checkCollision(p2, p1);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
