<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Cube Combat - 42 Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        P1: WASD + [1] Attacco | P2: FRECCE + [0] Attacco
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SETUP SCENA ---
        const scene = new THREE.Scene();
        
        // Camera Isometrica
        const aspect = window.innerWidth / window.innerHeight;
        const d = 5;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(10, 10, 10); // Angolazione isometrica classica
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

        // Griglia di riferimento
        scene.add(new THREE.GridHelper(10, 10));

        // --- CLASSE GIOCATORE ---
        class Player {
            constructor(color, startX, id) {
                this.id = id;
                this.speed = 0.08;
                
                // Cubo visibile
                const geo = new THREE.BoxGeometry(1, 1, 1);
                const mat = new THREE.MeshStandardMaterial({ color });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.set(startX, 0.5, 0);
                scene.add(this.mesh);

                // Hitbox d'attacco (invisibile all'inizio)
                const hitGeo = new THREE.BoxGeometry(1.2, 0.5, 1.2);
                const hitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
                this.hitVisual = new THREE.Mesh(hitGeo, hitMat);
                this.hitVisual.visible = false;
                scene.add(this.hitVisual);

                this.isAttacking = false;
                this.facing = new THREE.Vector3(1, 0, 0);
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                this.hitVisual.visible = true;
                this.mesh.scale.set(1.2, 0.8, 1.2); // Feedback visivo "schiacciato"

                // L'attacco dura 200ms
                setTimeout(() => {
                    this.isAttacking = false;
                    this.hitVisual.visible = false;
                    this.mesh.scale.set(1, 1, 1);
                }, 200);
            }

            update(keys, up, down, left, right, atkKey) {
                let moveX = 0;
                let moveZ = 0;

                if (keys[up]) moveZ -= 1;
                if (keys[down]) moveZ += 1;
                if (keys[left]) moveX -= 1;
                if (keys[right]) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize().multiplyScalar(this.speed);
                    this.mesh.position.add(moveVec);
                    this.facing.copy(moveVec).normalize();
                }

                if (keys[atkKey]) this.attack();

                // Posiziona l'hitbox davanti al player nella direzione in cui guarda
                this.hitVisual.position.copy(this.mesh.position);
                this.hitVisual.position.add(this.facing.clone().multiplyScalar(0.8));
            }
        }

        const p1 = new Player(0xff3333, -2, 1);
        const p2 = new Player(0x3333ff, 2, 2);

        // --- INPUT ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            p1.update(keys, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Digit1');
            p2.update(keys, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Digit0');

            // Logica di collisione attacco
            checkHit(p1, p2);
            checkHit(p2, p1);

            renderer.render(scene, camera);
        }

        function checkHit(attacker, victim) {
            if (attacker.isAttacking) {
                const attackBox = new THREE.Box3().setFromObject(attacker.hitVisual);
                const victimBox = new THREE.Box3().setFromObject(victim.mesh);

                if (attackBox.intersectsBox(victimBox)) {
                    victim.mesh.material.emissive.set(0xffffff); // Lampeggia se colpito
                    setTimeout(() => victim.mesh.material.emissive.set(0x000000), 100);
                }
            }
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
