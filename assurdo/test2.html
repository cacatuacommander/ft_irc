<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sprite Combat Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>BATTLE TEST</h1>
        P1: WASD + [1] ATTACCO | P2: FRECCE + [0] ATTACCO
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SETUP SCENA ---
        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
        const d = 5;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();

        // --- MAPPA (PAVIMENTO) ---
        // Usiamo una texture di test (una griglia scura)
        const groundTex = loader.load('https://threejs.org/examples/textures/grid.png');
        groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
        groundTex.repeat.set(10, 10);
        const groundMat = new THREE.MeshStandardMaterial({ map: groundTex });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
        ground.rotation.x = -Math.PI / 2; // Sdraiato
        scene.add(ground);

        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        // --- LOGICA PERSONAGGIO (SPRITE) ---
        class Fighter {
            constructor(imgUrl, startX) {
                const map = loader.load(imgUrl);
                const spriteMat = new THREE.SpriteMaterial({ map: map });
                this.sprite = new THREE.Sprite(spriteMat);
                this.sprite.scale.set(1.5, 1.5, 1);
                this.sprite.position.set(startX, 0.75, 0);
                scene.add(this.sprite);

                // Hitbox visiva (area di danno)
                const hitGeo = new THREE.RingGeometry(0.5, 0.7, 32);
                const hitMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0, side: THREE.DoubleSide });
                this.hitCircle = new THREE.Mesh(hitGeo, hitMat);
                this.hitCircle.rotation.x = Math.PI / 2;
                scene.add(this.hitCircle);

                this.isAttacking = false;
                this.facing = new THREE.Vector2(1, 0);
                this.hp = 100;
            }

            attack() {
                if (this.isAttacking) return;
                this.isAttacking = true;
                
                // "Animazione" rudimentale: ingrandisci e inclina lo sprite
                this.sprite.scale.set(2, 2, 1);
                this.hitCircle.material.opacity = 0.8;

                setTimeout(() => {
                    this.isAttacking = false;
                    this.sprite.scale.set(1.5, 1.5, 1);
                    this.hitCircle.material.opacity = 0;
                }, 150);
            }

            update(keys, up, down, left, right, atkKey) {
                const move = new THREE.Vector2(0, 0);
                if (keys[up]) move.y -= 1;
                if (keys[down]) move.y += 1;
                if (keys[left]) move.x -= 1;
                if (keys[right]) move.x += 1;

                if (move.length() > 0) {
                    move.normalize();
                    this.sprite.position.x += move.x * 0.08;
                    this.sprite.position.z += move.y * 0.08;
                    this.facing.copy(move);
                    
                    // Effetto "respiro" durante il movimento
                    this.sprite.position.y = 0.75 + Math.sin(Date.now() * 0.01) * 0.05;
                }

                if (keys[atkKey]) this.attack();

                // Posiziona l'hitbox davanti allo sprite
                this.hitCircle.position.set(
                    this.sprite.position.x + this.facing.x * 1.2,
                    0.1,
                    this.sprite.position.z + this.facing.y * 1.2
                );
            }
        }

        // Creiamo i due lottatori con immagini diverse
        // P1: Un'icona rossa, P2: Un'icona blu (Placeholder da internet)
        const p1 = new Fighter('https://threejs.org/examples/textures/uv_grid_opengl.jpg', -3); 
        const p2 = new Fighter('https://threejs.org/examples/textures/crate.gif', 3);

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            p1.update(keys, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Digit1');
            p2.update(keys, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Digit0');

            // Controllo collisione attacco
            if (p1.isAttacking) {
                if (p1.hitCircle.position.distanceTo(p2.sprite.position) < 1.5) {
                    p2.sprite.material.color.set(0xff0000); // Diventa rosso se colpito
                    setTimeout(() => p2.sprite.material.color.set(0xffffff), 100);
                }
            }
            if (p2.isAttacking) {
                if (p2.hitCircle.position.distanceTo(p1.sprite.position) < 1.5) {
                    p1.sprite.material.color.set(0xff0000);
                    setTimeout(() => p1.sprite.material.color.set(0xffffff), 100);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect; camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
